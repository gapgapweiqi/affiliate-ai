services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: affiliate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d affiliate"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bunx", "drizzle-kit", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  redirect:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
      REDIRECT_SERVER_HOST: 0.0.0.0
      REDIRECT_SERVER_PORT: "3001"
    command: ["bun", "run", "src/web/redirect-server.ts"]
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bun", "run", "src/scheduler/index.ts"]
    volumes:
      - ./site-out:/app/out
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  site-build:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bun", "run", "src/scripts/build-site.ts"]
    volumes:
      - ./site-out:/app/out
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]

  web:
    image: nginx:alpine
    volumes:
      - ./site-out:/srv/site:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - redirect
    restart: unless-stopped

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db
    restart: unless-stopped

  studio:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bunx", "drizzle-kit", "studio", "--host", "0.0.0.0", "--port", "4983"]
    ports:
      - "4983:4983"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
