# Port binding: only the public site (web, which also proxies /go/ to the
# redirect server) listens on all interfaces. Postgres, Adminer, Drizzle
# Studio, the redirect server and the dashboard bind to 127.0.0.1 — Docker
# publishes ports past ufw, so on a server they would otherwise be open to
# the internet. Override in .env: INTERNAL_BIND, DASHBOARD_BIND, WEB_BIND, WEB_PORT.
#
# The product website (web + redirect) is optional: it only starts when
# COMPOSE_PROFILES includes "site" (set in .env). Posts that link straight
# to Shopee (LINK_MODE=shopee) need neither a site nor a domain.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped   # come back after a reboot; scheduler needs it
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: affiliate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d affiliate"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bunx", "drizzle-kit", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  redirect:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
      REDIRECT_SERVER_HOST: 0.0.0.0
      REDIRECT_SERVER_PORT: "3001"
    command: ["bun", "run", "src/web/redirect-server.ts"]
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["site"]

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bun", "run", "src/scheduler/index.ts"]
    volumes:
      - ./site-out:/app/out
      # generated product videos (auto video post) — kept on the host for review
      - ./site-out/video:/tmp/affiliate-ai/video
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  site-build:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bun", "run", "src/scripts/build-site.ts"]
    volumes:
      - ./site-out:/app/out
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]

  web:
    image: nginx:alpine
    volumes:
      - ./site-out:/srv/site:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      - redirect
    restart: unless-stopped
    profiles: ["site"]

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:8081:8080"
    depends_on:
      - db
    restart: unless-stopped

  studio:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    command: ["bunx", "drizzle-kit", "studio", "--host", "0.0.0.0", "--port", "4983"]
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:4983:4983"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: ./src/dashboard
    env_file: .env
    environment:
      DATABASE_URL: postgresql://botuser:botpass@db:5432/affiliate?sslmode=disable
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:3100:3100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
